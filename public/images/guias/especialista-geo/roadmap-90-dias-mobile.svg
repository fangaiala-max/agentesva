<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1240" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap para aprender GEO en 90 días</title><desc id="desc">Tres etapas verticales: fundamentos, proyecto y validación de portfolio.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101f3c"/><stop offset="1" stop-color="#0a1730"/></linearGradient></defs>
  <rect width="720" height="1240" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="718" height="1238" rx="27" fill="none" stroke="#32466d" stroke-width="2"/>
  <text x="48" y="68" fill="#8aa4ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="3">ROADMAP PROFESIONAL</text><text x="48" y="122" fill="#fff" font-family="Georgia,serif" font-size="40">De los fundamentos</text><text x="48" y="168" fill="#fff" font-family="Georgia,serif" font-size="40">a un caso demostrable</text>
  <line x1="82" y1="260" x2="82" y2="1010" stroke="#5b7cff" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif">
    <circle cx="82" cy="288" r="30" fill="#5b7cff"/><text x="82" y="297" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1</text><rect x="132" y="222" width="540" height="246" rx="20" fill="#172a4b" stroke="#32466d"/><text x="168" y="270" fill="#8aa4ff" font-size="24" font-weight="700">DÍAS 1–30</text><text x="168" y="314" fill="#fff" font-size="34" font-weight="700">Fundamentos</text><text x="168" y="362" fill="#b7c2d4" font-size="26">• Base SEO y entidades</text><text x="168" y="402" fill="#b7c2d4" font-size="26">• Panel de preguntas</text><text x="168" y="442" fill="#b7c2d4" font-size="26">• Línea base verificable</text>
    <circle cx="82" cy="604" r="30" fill="#5b7cff"/><text x="82" y="613" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text><rect x="132" y="538" width="540" height="246" rx="20" fill="#172a4b" stroke="#32466d"/><text x="168" y="586" fill="#8aa4ff" font-size="24" font-weight="700">DÍAS 31–60</text><text x="168" y="630" fill="#fff" font-size="34" font-weight="700">Proyecto</text><text x="168" y="678" fill="#b7c2d4" font-size="26">• Auditoría y prioridades</text><text x="168" y="718" fill="#b7c2d4" font-size="26">• Tickets implementables</text><text x="168" y="758" fill="#b7c2d4" font-size="26">• Cambio y QA</text>
    <circle cx="82" cy="920" r="30" fill="#5b7cff"/><text x="82" y="929" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3</text><rect x="132" y="854" width="540" height="246" rx="20" fill="#172a4b" stroke="#32466d"/><text x="168" y="902" fill="#8aa4ff" font-size="24" font-weight="700">DÍAS 61–90</text><text x="168" y="946" fill="#fff" font-size="34" font-weight="700">Validación</text><text x="168" y="994" fill="#b7c2d4" font-size="26">• Re-medición</text><text x="168" y="1034" fill="#b7c2d4" font-size="26">• Límites y aprendizajes</text><text x="168" y="1074" fill="#b7c2d4" font-size="26">• Caso de portfolio</text>
  </g>
  <text x="360" y="1166" text-anchor="middle" fill="#a8b5ca" font-family="Arial,sans-serif" font-size="22">Resultado: un método y un caso revisable;</text><text x="360" y="1200" text-anchor="middle" fill="#71819b" font-family="Arial,sans-serif" font-size="20">no una garantía de contratación.</text>
</svg>
