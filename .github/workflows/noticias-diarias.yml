name: Noticias diarias — candidatos
on:
  schedule:
    - cron: '0 5 * * 1-5'   # 05:00 UTC = 06:00 Europe/Madrid, lun–vie
  workflow_dispatch: {}      # permite lanzarlo a mano para probar

# Sin secretos ni API key: sólo curación (RSS + señales sociales). La REDACCIÓN
# de cada noticia la hace un humano en una sesión de Claude Code (tom-4pass),
# no un proceso headless. Así no hay coste de API ni superficie de inyección.
permissions:
  contents: write        # empujar la rama de candidatos; el PR lo abre un humano

jobs:
  candidatos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Variables de fecha y rama
        id: vars
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "branch=noticias/candidatos-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Etapa A — News radar
        env:
          DATE: ${{ steps.vars.outputs.date }}
        run: node scripts/ai/news-radar.mjs --date="$DATE"

      - name: Etapa B — Selección (hasta 4, temas diversos)
        env:
          DATE: ${{ steps.vars.outputs.date }}
        run: node scripts/ai/select-noticias.mjs --date="$DATE" --n=4

      # Empuja la rama y deja el PR a un clic. NO usa `gh pr create`: el repo
      # tiene desactivado "Allow GitHub Actions to create and approve pull
      # requests", y ese toggle concede también auto-aprobación de PRs en un
      # repo que despliega a producción en cada merge. Como la redacción de
      # cada noticia ya la hace un humano (tom-4pass), el PR automático solo
      # ahorraba un clic: no compensa abrir ese permiso.
      - name: Publicar candidatos del día y preparar el PR
        env:
          DATE: ${{ steps.vars.outputs.date }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          COUNT=$(node -e "console.log(require('./docs/content/news-queue/'+process.env.DATE+'.selected.json').count)" 2>/dev/null || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "Sin candidatos de calidad hoy; no se empuja rama (no se rellena)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "agentesva-bot"
          git config user.email "bot@agentesva.com"
          git checkout -b "$BRANCH"
          git add docs/content/news-queue/
          git commit -m "chore(noticias): cola de candidatos $DATE"
          git push -u origin "$BRANCH"

          TITLE="📰 Noticias — candidatos $DATE ($COUNT)"
          # El título lleva emoji, espacios y guión largo: hay que urlencodearlo.
          TITLE_ENC=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$TITLE")
          URL="$SERVER_URL/$REPO/compare/main...$BRANCH?expand=1&title=$TITLE_ENC&labels=noticias,candidatos"

          {
            echo "## $TITLE"
            echo
            echo "**[→ Abrir el PR]($URL)** — título y etiquetas ya rellenados."
            echo
            echo "Rama empujada: \`$BRANCH\`"
            echo
            echo "---"
            echo
            node scripts/ai/pr-body.mjs --date="$DATE"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Rama $BRANCH empujada. Abre el PR desde el resumen del run."
